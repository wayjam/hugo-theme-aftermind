baseURL = 'https://example.org/'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
title = 'Aftermind'
theme = 'hugo-theme-aftermind'
enableRobotsTXT = true

[pagination]
  pagerSize = 5

[params]
  mainSections = ['posts']
  # Optional fallback social preview image (assets/, static/, or full HTTPS URL)
  # socialImage = 'images/share.jpg'
  # socialImageAlt = 'Aftermind archive cover'

[params.home]
  # showPlate = false # Hide plate and place wordmark beside the lead entry on wide screens
  # image = 'images/archive.svg' # Custom image or SVG (10:7 recommended)
  # imageAlt = 'Describe the plate contents'
  # caption = 'Archive plate caption'

[params.footer]
  # Optional GitHub icon link in footer (omit to hide)
  github = 'https://github.com/wayjam/hugo-theme-aftermind'
  # Show "Powered by Hugo · Aftermind" colophon (default: true)
  showThemeCredit = true

[params.search]
  # Options: 'json' (default, zero build steps), 'pagefind' (full-text), 'none' (disabled)
  provider = 'json'

[params.comments]
  # Disabled by default. Enable and add layouts/_partials/comments/provider.html in your site.
  enabled = false

[languages]
  [languages.en]
    contentDir = 'content/en'
    languageName = 'EN'
    languageCode = 'en-US'
    weight = 1
    [languages.en.params]
      description = 'Thought delegated, an echo lingers here.'
      [languages.en.params.home]
        subtitle = 'Thought delegated, an echo lingers here.'
      [languages.en.params.footer]
        text = '© 2026 Aftermind · Words and time alone'
    [languages.en.menus]
      [[languages.en.menus.main]]
        name = 'Home'
        pageRef = '/'
        weight = 10
      [[languages.en.menus.main]]
        name = 'Archives'
        pageRef = '/posts'
        weight = 20
      [[languages.en.menus.main]]
        name = 'Tags'
        pageRef = '/tags'
        weight = 30
      [[languages.en.menus.main]]
        name = 'About'
        pageRef = '/about'
        weight = 40

  [languages.zh-cn]
    contentDir = 'content/zh-cn'
    languageName = '中文'
    languageCode = 'zh-CN'
    hasCJKLanguage = true
    weight = 2
    [languages.zh-cn.params]
      description = '万事机衡，此间尚有回响'
      [languages.zh-cn.params.home]
        subtitle = '万事机衡，此间尚有回响'
      [languages.zh-cn.params.footer]
        text = '© 2026 Aftermind · 唯余文字与时间'
    [languages.zh-cn.menus]
      [[languages.zh-cn.menus.main]]
        name = '首页'
        pageRef = '/'
        weight = 10
      [[languages.zh-cn.menus.main]]
        name = '归档'
        pageRef = '/posts'
        weight = 20
      [[languages.zh-cn.menus.main]]
        name = '标签'
        pageRef = '/tags'
        weight = 30
      [[languages.zh-cn.menus.main]]
        name = '关于'
        pageRef = '/about'
        weight = 40
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)']]

  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true

[module]
  [module.hugoVersion]
    extended = false
    min = '0.146.0'
