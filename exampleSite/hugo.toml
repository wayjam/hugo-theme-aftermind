baseURL = 'https://example.org/'
defaultContentLanguage = 'zh-cn'
languageCode = 'zh-CN'
hasCJKLanguage = true
title = 'Aftermind'
theme = 'hugo-theme-aftermind'
enableRobotsTXT = true

[pagination]
  pagerSize = 5

[params]
  description = '智能之后 · 写给没有“人”看的东西'
  homeImageAlt = '停用工位平面图：移除显示器的桌台、摊开的交接簿与退后的空椅。'
  mainSections = ['posts']
  # 可选：未设置文章 cover 时的默认分享预览图（支持 assets/、static/ 或完整 HTTPS 地址）
  # socialImage = 'images/home-desk.webp'
  # socialImageAlt = 'Aftermind 档案封面'

[params.home]
  # 首页标语文案（不填时默认回退到 params.description；设为空字符串 "" 可隐藏）
  subtitle = '智能之后 · 写给没有“人”看的东西'

[params.footer]
  # 页脚自定义文案（支持行内 Markdown；不填时使用默认多语言文案）
  text = '© 2026 Aftermind · 智能之后 · 仅保留文字与时间'
  # 可选：页脚 GitHub 图标链接（留空则不显示）
  github = 'https://github.com/wayjam/hugo-theme-aftermind'
  # 是否显示 "Powered by Hugo · Aftermind" 署名（默认 true）
  showThemeCredit = true

[params.search]
  # 可选：'json'（默认，无需额外构建步骤）、'pagefind'（全文检索）、'none'（关闭搜索）
  provider = 'json'

[params.comments]
  # 默认关闭。启用后在站点的 layouts/_partials/comments/provider.html 放入评论系统嵌入代码
  enabled = false

[menus]
  [[menus.main]]
    name = '首页'
    pageRef = '/'
    weight = 10

  [[menus.main]]
    name = '归档'
    pageRef = '/posts'
    weight = 20

  [[menus.main]]
    name = '标签'
    pageRef = '/tags'
    weight = 30

  [[menus.main]]
    name = '关于'
    pageRef = '/about'
    weight = 40

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)']]

  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true

[module]
  [module.hugoVersion]
    extended = false
    min = '0.146.0'
