<svg class="home-plate-svg" viewBox="0 0 720 504" width="720" height="504"
     role="img" aria-label="{{ . }}" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="home-plate-room" x2="1" y2="1">
      <stop stop-color="var(--plate-ink)"/>
      <stop offset="1" stop-color="var(--plate-wall)"/>
    </linearGradient>
    <linearGradient id="home-plate-desk" x2="1" y2=".35">
      <stop stop-color="var(--plate-ink)"/>
      <stop offset="1" stop-color="var(--plate-edge)"/>
    </linearGradient>
    <linearGradient id="home-plate-window-light" x1="1" x2=".1" y2="1">
      <stop stop-color="var(--plate-light)" stop-opacity=".72"/>
      <stop offset="1" stop-color="var(--plate-light)" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="home-plate-paper" x2=".2" y2="1">
      <stop stop-color="var(--plate-paper)"/>
      <stop offset="1" stop-color="var(--plate-paper-deep)"/>
    </linearGradient>
    <pattern id="home-plate-perforation" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r=".8" fill="var(--plate-edge)"/>
    </pattern>
    <g id="home-plate-server">
      <rect x="0" y="0" width="140" height="33" rx="1" fill="var(--plate-wall)" stroke="var(--plate-edge)" stroke-opacity=".36"/>
      <path d="M4 29h132" stroke="var(--plate-ink)" stroke-width="2"/>
      <rect x="11" y="6" width="27" height="20" fill="url(#home-plate-perforation)"/>
      <path d="M45 8h52v7H45Zm0 11h52v5H45Z" fill="var(--plate-ink)"/>
      <path d="M52 11.5h13m8 0h13m-34 10h13m8 0h13" stroke="var(--plate-edge)" stroke-opacity=".5"/>
      <circle cx="116" cy="11" r="2.3" fill="var(--plate-status)"/>
      <circle cx="126" cy="11" r="1.7" fill="var(--plate-status)" fill-opacity=".45"/>
      <path d="M114 21h13" stroke="var(--plate-edge)" stroke-opacity=".55"/>
    </g>
    <g id="home-plate-rack">
      <rect width="166" height="298" fill="var(--plate-ink)" stroke="var(--plate-edge)" stroke-opacity=".68"/>
      <path d="M4 4h158v21H4Z" fill="var(--plate-wall)"/>
      <path d="M13 13h41m-41 5h23m99-3h16" stroke="var(--plate-edge)" stroke-opacity=".65"/>
      <path d="M6 35v223m154-223v223" fill="none" stroke="var(--plate-edge)" stroke-opacity=".55" stroke-dasharray="1 4"/>
      <use href="#home-plate-server" x="13" y="36"/>
      <use href="#home-plate-server" x="13" y="73"/>
      <use href="#home-plate-server" x="13" y="110"/>
      <use href="#home-plate-server" x="13" y="147"/>
      <use href="#home-plate-server" x="13" y="184"/>
      <path d="M13 222h140v39H13Z" fill="url(#home-plate-perforation)" opacity=".44"/>
      <path d="M7 269h152v21H7Zm16 7h35m-35 7h25" fill="none" stroke="var(--plate-edge)" stroke-opacity=".5"/>
    </g>
  </defs>

  <!-- The near rack is cropped. The second rack falls back into the room. -->
  <path d="M0 0h720v504H0Z" fill="url(#home-plate-room)"/>
  <path d="M366 0h13v303h-13ZM0 327l720-97v14L0 346Z" fill="var(--plate-ink)" fill-opacity=".6"/>
  <use href="#home-plate-rack" transform="matrix(.84 -.09 0 .9 175 54)" opacity=".62"/>
  <path d="M169 33l27 18v276l-27 26Z" fill="var(--plate-wall)" stroke="var(--plate-edge)" stroke-opacity=".38"/>
  <use href="#home-plate-rack" transform="matrix(1.07 -.065 0 1.08 -8 44)"/>

  <!-- Light from an off-frame window reaches the far wall and the desk. -->
  <path d="M720 32v158l-204 53 116-166Z" fill="var(--plate-light)" fill-opacity=".14"/>
  <path d="M720 87v17l-166 109 18-24Z" fill="var(--plate-light)" fill-opacity=".12"/>
  <path d="M181 384l166-128 373-52v300H181Z" fill="url(#home-plate-desk)"/>
  <path d="M362 266l358-51v289H230Z" fill="url(#home-plate-window-light)"/>
  <path d="M642 226l15-2-185 280h-18Zm78 40v19L571 504h-14Z" fill="var(--plate-ink)" fill-opacity=".24"/>
  <path d="M184 384l163-128 373-52" fill="none" stroke="var(--plate-edge)" stroke-opacity=".66" stroke-width="1.5"/>

  <!-- The crop catches only the shoulder of the chair pulled away from the desk. -->
  <path d="M0 367c42-33 91-36 138-20l64 24c14 6 22 17 25 32l19 101H0Z" fill="var(--plate-ink)"/>
  <path d="M0 382c44-34 91-38 134-23l65 25c9 3 13 10 15 20l17 100" fill="none" stroke="var(--plate-edge)" stroke-opacity=".53" stroke-width="2"/>
  <path d="M0 419c47-24 93-27 142-8l48 19 11 74" fill="none" stroke="var(--plate-edge)" stroke-opacity=".21" stroke-width="1.25"/>

  <!-- Warm paper and blank ruled space carry the unfinished sentence. -->
  <g transform="translate(358 249) rotate(-9)">
    <path d="M1 12h270l1 187-31 24H-4Z" fill="var(--plate-ink)" fill-opacity=".36"/>
    <path d="M-8 3h269v193l-28 23H-12Z" fill="var(--plate-paper-deep)"/>
    <path d="M0 0h258v188l-27 24H0Z" fill="url(#home-plate-paper)"/>
    <path d="M258 188h-27v24Z" fill="var(--plate-mark)" fill-opacity=".24"/>
    <path d="M31 23v163M18 77h219m-219 37h219m-219 37h219m-219 37h196" fill="none" stroke="var(--plate-mark)" stroke-opacity=".3" stroke-width="1"/>
    <text x="230" y="35" text-anchor="end" fill="var(--plate-mark)" font-family="var(--font-mono)" font-size="16" letter-spacing="1">18:05</text>
    <text class="home-plate-note" x="44" y="70" fill="var(--plate-mark)" font-family="var(--font-serif)" font-size="31" font-style="italic">{{ i18n "home_plate_note" | default "Tomorrow, I" }}</text>
  </g>
  <g transform="translate(630 338) rotate(25)">
    <path d="M3 4l9 11v105l-4 5H4l-4-5V15Z" fill="var(--plate-ink)" fill-opacity=".38"/>
    <path d="M0 0l5 13v105h-10V13Z" fill="var(--plate-ink)"/>
    <path d="M-3 19v82m-2-11h10" fill="none" stroke="var(--plate-edge)" stroke-width="1.2"/>
    <path d="M0 0l5 13h-10Z" fill="var(--plate-edge)"/>
  </g>
</svg>
