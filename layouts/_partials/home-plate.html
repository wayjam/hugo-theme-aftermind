      <stop stop-color="var(--plate-wall)"/>
      <stop offset="1" stop-color="var(--plate-ink)"/>
    </linearGradient>
    <linearGradient id="home-plate-light" x1="1" y1="0" x2="0" y2="1">
      <stop stop-color="var(--plate-light)" stop-opacity=".82"/>
      <stop offset="1" stop-color="var(--plate-light)" stop-opacity=".23"/>

    <pattern id="home-plate-etch" width="4" height="7" patternUnits="userSpaceOnUse">
