<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9E6DD">
<title>{{ if .IsHome }}{{ site.Title }}{{ with site.Params.description }} — {{ . }}{{ end }}{{ else }}{{ printf "%s — %s" .Title site.Title }}{{ end }}</title>
<link rel="icon" href="{{ `favicon.svg` | relURL }}" type="image/svg+xml">
<link rel="alternate icon" href="{{ `favicon.ico` | relURL }}" sizes="any">
<link rel="preload" href="{{ `fonts/barlow-condensed-700.woff2` | relURL }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ `fonts/ibm-plex-serif-400.woff2` | relURL }}" as="font" type="font/woff2" crossorigin>
{{- with .OutputFormats.Get "rss" }}
  {{ printf `<link rel=%q type=%q href=%q title=%q>` .Rel .MediaType.Type .Permalink site.Title | safeHTML }}
{{- end }}
{{- if .IsTranslated }}
  {{- range .AllTranslations }}
<link rel="alternate" hreflang="{{ or .Language.LanguageCode .Lang }}" href="{{ .Permalink }}">
  {{- end }}
{{- end }}
<script>
(function(){
  var r = document.documentElement;
  r.classList.add('js');
  var m = 'system';
  try {
    var s = localStorage.getItem('aftermind-theme');
    if (s === 'light' || s === 'dark') m = s;
  } catch (e) {}
  if (m !== 'system') r.setAttribute('data-theme', m);
  var dark = m === 'dark' || (m === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', dark ? '#24232B' : '#E9E6DD');
})();
</script>
{{ partial "head/css.html" . }}
{{ partial "head/js.html" . }}
