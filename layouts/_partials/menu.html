{{- $page := .page }}
{{- $menuID := .menuID }}
{{- with index site.Menus $menuID }}
  <nav class="site-nav" aria-label="{{ i18n `nav_label` | default `Main navigation` }}">
    <ul>
      {{- range . }}
        {{- $active := $page.IsMenuCurrent .Menu . }}
        {{- $ancestor := $page.HasMenuCurrent .Menu . }}
        <li>
          <a href="{{ .URL }}"
            {{- if $active }} aria-current="page"
            {{- else if $ancestor }} aria-current="true"
            {{- end -}}
          >{{ .Name }}</a>
        </li>
      {{- end }}
    </ul>
  </nav>
{{- end }}
