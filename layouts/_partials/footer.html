<div class="shell site-footer-inner">
  <p class="site-footer-meta">
    <span translate="no">{{ site.Title }}</span> · {{ i18n "footer_note" | default "Text and time only" }}
  </p>
  <div class="site-footer-links">
    {{- with site.Home.OutputFormats.Get "rss" }}
      <a class="footer-rss-link" href="{{ .RelPermalink }}">{{ partial "icon.html" (dict "name" "rss" "class" "ui-icon ui-icon--sm") }}<span>{{ i18n "rss_label" | default "RSS Feed" }}</span></a>
    {{- end }}
  </div>
</div>
