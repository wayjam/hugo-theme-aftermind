title = 'Aftermind'

[pagination]
  pagerSize = 20

[params]
  mainSections = ['posts']

[params.footer]
  github = 'https://github.com/wayjam/hugo-theme-aftermind'
  showThemeCredit = true

[params.search]
  provider = 'json'

[menus]
  [[menus.main]]
    identifier = 'home'
    pageRef = '/'
    weight = 10
    [menus.main.params]
      i18n = 'nav_home'

  [[menus.main]]
    identifier = 'archives'
    pageRef = '/posts'
    weight = 20
    [menus.main.params]
      i18n = 'nav_archives'

  [[menus.main]]
    identifier = 'tags'
    pageRef = '/tags'
    weight = 30
    [menus.main.params]
      i18n = 'nav_tags'
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)']]

  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
[module]
  [module.hugoVersion]
    extended = false
    min = '0.146.0'
