baseURL = 'https://example.org/'
defaultContentLanguage = 'zh-cn'
languageCode = 'zh-CN'
hasCJKLanguage = true
title = 'Aftermind'

[pagination]
  pagerSize = 20

[params]
  description = '智能之后 · 写给没有“人”看的东西'
  homeImage = 'images/home-desk.webp'
  homeImageMobile = 'images/home-desk-mobile.webp'
  homeImageAlt = '午后自然侧光下的空工位：桌面右侧摊开一本旧交接簿，旁边是一张微微转向的空办公椅和翻扣的空白工牌。'
  mainSections = ['posts']

[params.footer]
  github = 'https://github.com/wayjam/hugo-theme-aftermind'
  showThemeCredit = true

[params.search]
  provider = 'json'

[menus]
  [[menus.main]]
    name = '首页'
    pageRef = '/'
    weight = 10

  [[menus.main]]
    name = '归档'
    pageRef = '/posts'
    weight = 20
    params = { icon = 'list' }

  [[menus.main]]
    name = '标签'
    pageRef = '/tags'
    weight = 30
    params = { icon = 'tag' }

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)']]

  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
[module]
  [module.hugoVersion]
    extended = false
    min = '0.146.0'
